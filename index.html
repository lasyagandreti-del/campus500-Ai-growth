<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus500 AI Growth Checklist</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light text-dark">

  <main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
      <div class="card-body p-4 p-md-5">

        <h1 class="h3 text-primary mb-2">
          Campus500 AI Growth
        </h1>

        <p class="text-secondary mb-4">
          Select each task when you complete it.
        </p>

        <div id="checklist" class="list-group mb-4">

          <label class="list-group-item d-flex align-items-center gap-3 py-3">
            <input class="form-check-input rounded-circle flex-shrink-0"
                   type="checkbox" value="Set learning goals">
            <span>Set learning goals</span>
          </label>

          <label class="list-group-item d-flex align-items-center gap-3 py-3">
            <input class="form-check-input rounded-circle flex-shrink-0"
                   type="checkbox" value="Complete daily tasks">
            <span>Complete daily tasks</span>
          </label>

          <label class="list-group-item d-flex align-items-center gap-3 py-3">
            <input class="form-check-input rounded-circle flex-shrink-0"
                   type="checkbox" value="Learn a new skill">
            <span>Learn a new skill</span>
          </label>

          <label class="list-group-item d-flex align-items-center gap-3 py-3">
            <input class="form-check-input rounded-circle flex-shrink-0"
                   type="checkbox" value="Review progress">
            <span>Review progress</span>
          </label>

          <label class="list-group-item d-flex align-items-center gap-3 py-3">
            <input class="form-check-input rounded-circle flex-shrink-0"
                   type="checkbox" value="Plan next steps">
            <span>Plan next steps</span>
          </label>

        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-secondary small">Completed tasks</span>
          <span id="progress" class="badge text-bg-primary">0 / 5</span>
        </div>

        <div class="progress mb-4" role="progressbar"
             aria-label="Checklist progress"
             aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" id="progressBar">
          <div id="progressFill" class="progress-bar" style="width: 0%"></div>
        </div>

        <button id="downloadBtn" type="button"
                class="btn btn-primary w-100">
          Download Checklist
        </button>

        <p class="small text-secondary text-center mt-3 mb-0">
          Your selected tasks will be included in the downloaded file.
        </p>

      </div>
    </div>
  </main>

  <script>
    const checkboxes = document.querySelectorAll(
      '#checklist input[type="checkbox"]'
    );

    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    function updateProgress() {
      const completed = [...checkboxes].filter(box => box.checked).length;
      const total = checkboxes.length;
      const percent = total ? (completed / total) * 100 : 0;

      progress.textContent = `${completed} / ${total}`;
      progressFill.style.width = `${percent}%`;
      progressBar.setAttribute('aria-valuenow', percent);
    }

    checkboxes.forEach(box => {
      box.addEventListener('change', updateProgress);
    });
